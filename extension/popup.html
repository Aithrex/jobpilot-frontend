<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 300px; margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #18181b; }
      .wrap { padding: 14px; }
      .title { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 6px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #d4d4d8; }
      .dot.on { background: #10b981; }
      .status { font-size: 12px; color: #52525b; margin: 8px 0 12px; }
      button { width: 100%; padding: 9px; border-radius: 9px; border: 1px solid #e4e4e7; background: #fafafa; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
      button.primary { background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; border: none; }
      button:hover { border-color: #a78bfa; }
      .row { display: flex; gap: 6px; }
      .row button { margin-bottom: 0; }
      textarea { width: 100%; height: 54px; border: 1px solid #e4e4e7; border-radius: 9px; padding: 7px; font-size: 12px; resize: none; margin-bottom: 8px; }
      a { color: #6d28d9; font-weight: 600; text-decoration: none; font-size: 12px; }
      .foot { font-size: 11px; color: #a1a1aa; margin-top: 8px; line-height: 1.4; }
      .hide { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title"><span id="dot" class="dot"></span> JobPilot Apply</div>
      <div id="status" class="status">Checking…</div>

      <button id="sync" class="primary">Sync my profile</button>
      <a id="openapp" href="#" target="_blank" rel="noopener">Open the JobPilot app →</a>

      <div id="manual" class="hide" style="margin-top:12px;">
        <div style="font-size:12px;font-weight:600;margin-bottom:6px;">Paste your token (fallback)</div>
        <textarea id="token" placeholder="Sign in to the app — it auto-syncs. Or paste the JWT here."></textarea>
        <div class="row">
          <button id="save">Save token</button>
          <button id="clear">Disconnect</button>
        </div>
      </div>

      <div class="foot">Autofill + résumé-grounded answers on Workday, Greenhouse, Lever, iCIMS, Ashby &amp; SmartRecruiters. You always review &amp; submit.</div>
    </div>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
