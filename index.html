<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Aspirely: Upload your resume. See the jobs that fit.</title>
  <meta name="description" content="Get five matched roles from direct employer career sites, sponsorship signals from public filings, and one tailored resume free. No account or card needed." />
  <meta name="author" content="Aspirely" />

  <meta property="og:title" content="Aspirely: Upload your resume. See the jobs that fit." />
  <meta property="og:description" content="Five matched roles from direct employer career sites, sponsorship signals from public filings, and one tailored resume free. No account or card needed." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://aspirely.me/" />
  <meta property="og:site_name" content="Aspirely" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Theme color for browser UI -->
  <meta name="theme-color" content="#4338CA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#27272A" media="(prefers-color-scheme: dark)">
  <!-- CSP: allow the product API, Google Fonts, data: images, blob: iframe for the resume viewer.
       Datadog RUM ships events to *.browser-intake-datadoghq.com (event intake) and
       reads SDK chunks from www.datadoghq-browser-agent.com when the recorder lazy-loads. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self' blob:; connect-src 'self' http://localhost:5000 https://*.browser-intake-datadoghq.com; img-src 'self' data: https:; script-src 'self' https://www.datadoghq-browser-agent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
