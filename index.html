  <meta property="og:title" content="Aspirely: Turn the visa clock into a plan" />

  <meta name="theme-color" content="#4338CA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#27272A" media="(prefers-color-scheme: dark)">
  <!-- CSP: allow the product API, Google Fonts, data: images, blob: iframe for the resume viewer.
       Datadog RUM ships events to *.browser-intake-datadoghq.com (event intake) and
       reads SDK chunks from www.datadoghq-browser-agent.com when the recorder lazy-loads. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; frame-src 'self' blob:; connect-src 'self' http://localhost:5000 https://*.browser-intake-datadoghq.com; img-src 'self' data: https:; script-src 'self' https://www.datadoghq-browser-agent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com;">
</head>
