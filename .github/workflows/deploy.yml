name: Deploy Frontend to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  API_URL: https://aspirely.me/api

jobs:
  # Deploy must not race verification. needs: cannot cross workflows, so this
  # waits on tests.yml for THIS commit SHA. A failed, cancelled, timed-out,
  # or missing suite refuses to deploy. An older green run cannot authorize
  # a newer commit. workflow_dispatch is not a bypass.
  await-tests:
    name: Wait for the frontend suite
    runs-on: ubuntu-latest
    steps:
      - name: Poll the tests workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs"
          for attempt in $(seq 1 60); do
            CONCLUSION=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"' 2>/dev/null || echo pending)
            STATUS=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].status // "missing"' 2>/dev/null || echo missing)
            echo "attempt ${attempt}: status=${STATUS} conclusion=${CONCLUSION}"
            case "$CONCLUSION" in
              success)
                echo "Frontend suite is green for ${GITHUB_SHA:0:7}."
                exit 0 ;;
              failure|cancelled|timed_out)
                echo "::error::Frontend suite concluded '${CONCLUSION}' for ${GITHUB_SHA:0:7}; refusing to deploy."
                exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::No conclusive tests run for ${GITHUB_SHA:0:7} after 20 minutes; refusing to deploy."
          exit 1

  deploy:
    name: Build & deploy SPA
    runs-on: ubuntu-latest
    needs: [await-tests]
    if: needs.await-tests.result == 'success' && !cancelled()
    steps:
      - uses: actions/checkout@v4

      # No version here — it's read from the "packageManager" field in package.json
      # (specifying both errors with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write production env
        run: |
          {
            echo "VITE_API_URL=${API_URL}"
            # Optional Datadog RUM (publishable client values only)
            [ -n "${{ secrets.VITE_DD_RUM_APPLICATION_ID }}" ] && echo "VITE_DD_RUM_APPLICATION_ID=${{ secrets.VITE_DD_RUM_APPLICATION_ID }}"
            [ -n "${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}" ] && echo "VITE_DD_RUM_CLIENT_TOKEN=${{ secrets.VITE_DD_RUM_CLIENT_TOKEN }}"
            [ -n "${{ secrets.VITE_DD_RUM_SITE }}" ] && echo "VITE_DD_RUM_SITE=${{ secrets.VITE_DD_RUM_SITE }}"
            echo "VITE_DD_RUM_ENV=prod"
            echo "VITE_DD_RUM_VERSION=${{ github.sha }}"
            # Guest onboarding (no-signup /start flow) — ON in prod.
            echo "VITE_GUEST_ONBOARDING=true"
          } > .env.production

      - name: Build
        run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          B="s3://${{ secrets.S3_BUCKET_NAME }}"
          # Hashed assets — cache hard, delete removed files. Keep index.html out of this pass.
          aws s3 sync dist/ "$B/" --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"
          # index.html — never cache, so new deploys are picked up instantly.
          aws s3 cp dist/index.html "$B/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" --no-cli-pager

      - name: Summary
        run: |
          echo "### Frontend deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: https://aspirely.me" >> "$GITHUB_STEP_SUMMARY"
