# Frontend verification suite. Runs on every push and pull request,
# independently of deploy.yml. Deploy waits for this workflow on the
# same commit SHA — an older green run cannot authorize a newer commit.
name: tests

on:
  # main only: deploy.yml waits for THIS run on the merge commit. A pull
  # request is covered by its own run below; running on every branch push
  # as well tested each PR commit twice (2026-11-05).
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify
        run: node scripts/verify.mjs --full
